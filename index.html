<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوت به دیت ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .hearts-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .heart { position: absolute; font-size: 2rem; animation: floatUp 6s linear infinite; opacity: .6; }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(.5); opacity: 0; }
    10% { opacity: .7; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }
  .stage {
    position: relative; z-index: 1; width: 100%; max-width: 600px; padding: 1rem;
  }
  .card {
    background: rgba(255,255,255,.25);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.6);
    border-radius: 30px; padding: 2.5rem; text-align: center;
    box-shadow: 0 20px 60px rgba(255, 105, 135, .3);
    animation: popIn .8s ease;
  }
  @keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  h1 { font-size: 2.2rem; color: #d6336c; margin-bottom: 1rem; }
  p { font-size: 1.3rem; color: #6b2140; margin-bottom: 1.5rem; }
  .emoji { font-size: 3.5rem; display: block; margin-bottom: 1rem; animation: beat 1s infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  .btn-row { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: .9rem 2.5rem; font-size: 1.2rem; border: none; border-radius: 50px;
    cursor: pointer; font-weight: bold; transition: .3s; font-family: inherit;
  }
  .btn-yes { background: #d6336c; color: white; }
  .btn-yes:hover { transform: scale(1.08); box-shadow: 0 8px 30px rgba(214,51,108,.5); }
  .btn-no { background: rgba(255,255,255,.6); color: #6b2140; }
  .btn-no:hover { transform: scale(.95); }
  .hidden { display: none !important; }
  input, select {
    width: 100%; padding: .9rem 1.2rem; font-size: 1.1rem; border-radius: 15px;
    border: 2px solid rgba(255,255,255,.7); background: rgba(255,255,255,.6);
    margin: .6rem 0; font-family: inherit; color: #6b2140; outline: none;
  }
  input:focus, select:focus { border-color: #d6336c; }
  .small-text { font-size: 1rem; color: #8a4b6a; margin-top: 1rem; }
  .invite-card {
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    color: white; border-radius: 25px; padding: 2rem; margin-top: 1rem;
    box-shadow: 0 15px 40px rgba(214,51,108,.4);
  }
  .invite-card h2 { margin-bottom: 1rem; }
  .invite-card .row { display: flex; justify-content: space-between; padding: .6rem 0; border-bottom: 1px dashed rgba(255,255,255,.5); }
  .invite-card .row span:first-child { font-weight: bold; }
</style>
</head>
<body>
<div class="hearts-bg" id="heartsBg"></div>

<div class="stage">
  <!-- گام 1: سوال اصلی -->
  <div class="card" id="step1">
    <span class="emoji">💖</span>
    <h1>یه سوال مهم دارم...</h1>
    <p>میای با من بریم دیت؟</p>
    <div class="btn-row">
      <button class="btn btn-yes" id="yesBtn">آره ❤️</button>
      <button class="btn btn-no" id="noBtn">نه 😅</button>
    </div>
    <p class="small-text" id="noMessage"></p>
  </div>

  <!-- گام 2: انتخاب زمان -->
  <div class="card hidden" id="step2">
    <span class="emoji">🕐</span>
    <h1>خب، کی بریم؟</h1>
    <input type="date" id="dateInput">
    <input type="time" id="timeInput">
    <div class="btn-row" style="margin-top:1rem">
      <button class="btn btn-yes" id="timeOkBtn">این زمان خوبه ❤️</button>
    </div>
  </div>

  <!-- گام 3: انتخاب مکان -->
  <div class="card hidden" id="step3">
    <span class="emoji">📍</span>
    <h1>کجا رو بیشتر دوست داری؟</h1>
    <select id="placeSelect">
      <option value="">یک جایی انتخاب کن...</option>
      <option value="رستوران">رستوران 🍽️</option>
      <option value="کافه">کافه ☕</option>
      <option value="سینما">سینما 🎬</option>
      <option value="پارک">پارک 🌳</option>
      <option value="فرقی نداره">فرقی نداره 🤷‍♀️</option>
    </select>
    <div class="btn-row" style="margin-top:1rem">
      <button class="btn btn-yes" id="placeOkBtn">عالیه ❤️</button>
    </div>
  </div>

  <!-- گام 4: شماره -->
  <div class="card hidden" id="step4">
    <span class="emoji">📱</span>
    <h1>آخه... می‌تونم شمارت رو هم داشته باشم؟</h1>
    <input type="tel" id="phoneInput" placeholder="مثلاً 09123456789">
    <div class="btn-row" style="margin-top:1rem">
      <button class="btn btn-yes" id="phoneOkBtn">حتماً، بگیر ❤️</button>
    </div>
  </div>

  <!-- گام 5: کارت دعوت -->
  <div class="card hidden" id="step5">
    <span class="emoji">💌</span>
    <h1>مرسی که قبول کردی!</h1>
    <div class="invite-card" id="inviteCard">
      <h2>کارت دعوت رسمی</h2>
      <div class="row"><span>📅 زمان:</span><span id="invDate"></span></div>
      <div class="row"><span>📍 مکان:</span><span id="invPlace"></span></div>
      <div class="row"><span>📱 شماره:</span><span id="invPhone"></span></div>
    </div>
    <p class="small-text">فقط فراموش نکن... زود بیا! 😉</p>
    <div class="="margin-top:1rem">
      <button class="btn btn-yes" id="downloadBtn">دانلود کارت (txt) �</button>
    </div>
    <p class="small-text" id="finalMsg"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
